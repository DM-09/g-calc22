<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5등급제 시험 성적 계산기</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white text-black flex flex-col items-center justify-center p-3">
  <br><br>
  <div class="w-full max-w-3xl space-y-6">
    <div class="bg-neutral-100 rounded-2xl border border-neutral-300 p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">과목 성적 입력</h2>
        <button onclick="addRow()" class="px-3.5 py-1.5 text-sm font-medium bg-black text-white rounded-lg hover:bg-neutral-800 transition-colors">
          + 과목 추가
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-neutral-300 text-xs font-semibold text-neutral-500">
              <th class="py-3 px-2">과목</th>
              <th class="py-3 px-2">석차</th>
              <th class="py-3 px-2">수강자 수</th>
              <th class="py-3 px-2">학점</th>
              <th class="py-3 px-2 text-center"></th>
            </tr>
          </thead>
          <tbody id="subjectTableBody" class="divide-y divide-neutral-200"></tbody>
        </table>
      </div>

      <div class="pt-2 flex justify-end">
        <button onclick="calculateGrades()" class="w-full sm:w-auto px-6 py-2.5 bg-black hover:bg-neutral-800 text-white font-medium rounded-xl transition-colors">성적 계산하기</button>
      </div>
    </div>

    <div class="bg-neutral-100 rounded-2xl border border-neutral-300 p-6 space-y-4">
      <h2 class="text-lg font-semibold">계산 결과</h2>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-neutral-300 text-xs font-semibold text-neutral-500">
              <th class="py-3 px-2">과목</th>
              <th class="py-3 px-2">등급</th>
              <th class="py-3 px-2">등급 컷</th>
            </tr>
          </thead>
          <tbody id="resultTableBody" class="divide-y divide-neutral-200">
            <tr>
              <td colspan="3" class="py-6 text-center text-sm text-neutral-500">아직 계산된 결과가 없습니다. 성적을 입력하고 계산하기 버튼을 눌러주세요.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="averageArea" class="hidden pt-4 border-t border-neutral-300 flex justify-between items-center">
        <span class="text-sm font-medium text-neutral-500">평균 등급</span>
        <span id="averageResult" class="text-xl font-bold text-black"></span>
      </div>
    </div>
  </div>
  <br><br><br>　

  <script>
    const p = [0.1, 0.34, 0.66, 0.90] // 등급 비율 (누적)
    let a = JSON.parse(localStorage.getItem('grades_data')) || []
    
    window.onload = function() {
      renderInputs()
      calculateGrades()
    }

    function saveData() { localStorage.setItem('grades_data', JSON.stringify(a)) }

    function renderInputs() {
      const tbody = document.getElementById('subjectTableBody')
      tbody.innerHTML = ''
      
      if (a.length == 0) return
      a.forEach((item, index) => {
        const tr = document.createElement('tr')
        tr.innerHTML = `
          <td class="py-2.5 px-2">
            <input type="text" value="${item[0]}" class="w-full bg-white border border-neutral-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-black" onchange="updateData(${index}, 0, this.value)">
          </td>
          <td class="py-2.5 px-2">
            <input type="number" value="${item[1]}" class="w-full bg-white border border-neutral-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-black" onchange="updateData(${index}, 1, this.value)">
          </td>
          <td class="py-2.5 px-2">
            <input type="number" value="${item[2]}" class="w-full bg-white border border-neutral-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-black" onchange="updateData(${index}, 2, this.value)">
          </td>
          <td class="py-2.5 px-2">
            <input type="number" value="${item[3]}" class="w-full bg-white border border-neutral-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-black" onchange="updateData(${index}, 3, this.value)">
          </td>
          <td class="py-2.5 px-2 text-center">
            <button onclick="removeRow(${index})" class="text-neutral-400 hover:text-black text-sm font-bold px-2 py-1 transition-colors">×</button>
          </td>
        `
        tbody.appendChild(tr)
      })
    }

    function updateData(index, fieldIndex, value) {
      if (fieldIndex >= 1) {
        a[index][fieldIndex] = Number(value)
      } else {
        a[index][fieldIndex] = value
      }
      saveData()
    }

    function addRow() {
      a.push(['새 과목', 1, 100, 3])
      saveData()
      renderInputs()
    }

    function removeRow(index) {
      if (a.length <= 1) {
        alert('최소 한 개 이상의 과목이 필요합니다.')
        return
      }
      a.splice(index, 1)
      saveData()
      renderInputs()
      calculateGrades()
    }

    function calculateGrades() {
      let r = []
      let dg = [0, 0] // 평균 등급 계산 (총 등급, 총 학점)

      for (let i of a) {
        let name = i[0]
        let rank = i[1]
        let num = i[2]
        let s = i[3]

        let cut = [Math.round(num * p[0]), Math.round(num * p[1]), Math.round(num * p[2]), Math.round(num * p[3])]
        let d = 0
        let cut_line = ''

        if (rank <= cut[0]) { d = 1 } 
        else if (rank <= cut[1]) { d = 2 }
        else if (rank <= cut[2]) { d = 3 }
        else if (rank <= cut[3]) { d = 4 }
        else { d = 5 }

        if (d == 1) { cut_line = `1등급 컷<br><span class="text-xs text-neutral-500">${cut[0]}등</span>` }
        else { cut_line = `${d-1}등급 컷<br><span class="text-xs text-neutral-500">${cut[d-2]}등 (${cut[d-2]-rank})</span>` }

        r.push([name, d, cut_line])
        dg[0] += d * s
        dg[1] += s
        
      }

      const resultTbody = document.getElementById('resultTableBody')
      resultTbody.innerHTML = ''

      r.forEach(item => {
        let tr = document.createElement('tr')
        tr.innerHTML = `
          <td class="py-3 px-2 font-medium">${item[0]}</td>
          <td class="py-3 px-2"><span class="px-2.5 py-1 bg-neutral-200 text-black rounded-lg font-semibold text-sm">${item[1]}</span></td>
          <td class="py-3 px-2 text-sm">${item[2]}</td>
        `
        resultTbody.appendChild(tr)
      })

      const averageArea = document.getElementById('averageArea')
      const averageResult = document.getElementById('averageResult')
      
      if (dg[1] > 0) {
        let avg = Math.round((dg[0] / dg[1]) * 100) / 100
        averageResult.innerText = avg
        averageArea.classList.remove('hidden')
      } else {
        averageArea.classList.add('hidden')
      }
    }
  </script>
</body>
</html>
